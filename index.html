<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC93C">
<title>Learn Arabic with Kaka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='54' r='42' fill='%23FFC93C'/%3E%3Ccircle cx='36' cy='48' r='6' fill='%232B2A4C'/%3E%3Ccircle cx='64' cy='48' r='6' fill='%232B2A4C'/%3E%3Cpath d='M32 62 Q50 84 68 62 Z' fill='%238A2B3D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F9FF; --surface: #FFFFFF; --ink: #2B2A4C; --muted: #625F8A; --line: #D9E4F5;
    --brand: #6A4BF0; --brand-ink: #FFFFFF; --soft: #ECE8FF;
    --sun: #FFC93C; --band-ink: #2B2A4C;
    --mint: #17A57F; --mint-soft: #D9F6EC;
    --sky: #1E98E0; --sky-soft: #DCF1FF;
    --coral: #E8523F; --coral-soft: #FFE4DF;
    --good: #12805C; --good-soft: #D9F6EC; --bad: #C4372B; --bad-soft: #FFE4DF; --gold: #F59E0B;
    --outer: #DCE9F7;
    --f-head: "Baloo 2", "Nunito", system-ui, sans-serif;
    --f-ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-ar: "Cairo", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14132E; --surface: #201F48; --ink: #F4F3FF; --muted: #ABA9D6; --line: #35346B;
      --brand: #A08EFF; --brand-ink: #14132E; --soft: #2D2B63;
      --mint: #3FD9AE; --mint-soft: #123B35; --sky: #5CC2FF; --sky-soft: #14364F; --coral: #FF8D7E; --coral-soft: #4A2320;
      --good: #4FD6A0; --good-soft: #123B35; --bad: #FF8F86; --bad-soft: #4A2320; --gold: #FFC24D; --outer: #0B0A1F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14132E; --surface: #201F48; --ink: #F4F3FF; --muted: #ABA9D6; --line: #35346B;
    --brand: #A08EFF; --brand-ink: #14132E; --soft: #2D2B63;
    --mint: #3FD9AE; --mint-soft: #123B35; --sky: #5CC2FF; --sky-soft: #14364F; --coral: #FF8D7E; --coral-soft: #4A2320;
    --good: #4FD6A0; --good-soft: #123B35; --bad: #FF8F86; --bad-soft: #4A2320; --gold: #FFC24D; --outer: #0B0A1F;
  }
  .lv0 { --lv: var(--mint); --lv-soft: var(--mint-soft); }
  .lv1 { --lv: var(--sky); --lv-soft: var(--sky-soft); }
  .lv2 { --lv: var(--coral); --lv-soft: var(--coral-soft); }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--outer); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.45; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, .fcard:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  a { color: var(--brand); }
  h1, h2, h3 { font-family: var(--f-head); }

  #shell { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg); position: relative; padding-bottom: 96px; box-shadow: 0 0 0 1px var(--line); }
  .ar { direction: rtl; unicode-bidi: isolate; font-family: var(--f-ar); font-weight: 700; }
  .kaka { display: block; overflow: visible; }
  .hop { animation: hop 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes hop { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }

  /* ---------- welcome ---------- */
  .welcome { padding: calc(30px + env(safe-area-inset-top, 0px)) 24px 40px; text-align: center; }
  .welcome .kaka { margin: 0 auto 6px; }
  .welcome .hi { font-size: 3.2rem; line-height: 1.5; color: var(--brand); }
  .welcome h1 { font-size: 2.2rem; line-height: 1.05; margin: 0 0 8px; letter-spacing: -0.01em; }
  .welcome h1 em { font-style: normal; color: var(--coral); }
  .lead { color: var(--muted); margin: 0 auto 22px; max-width: 32ch; }
  .who { margin-bottom: 20px; }
  .who .lab { font-weight: 800; margin-bottom: 8px; }
  .chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 18px; margin: 0 6px 8px; font-weight: 700; }
  .chip:hover { border-color: var(--brand); }
  .field { text-align: left; }
  .field label { display: block; font-weight: 800; margin-bottom: 8px; }
  .field input { width: 100%; padding: 15px 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 1.1rem; font-weight: 700; }
  .welcome .btn { width: 100%; margin-top: 12px; }
  .fine { color: var(--muted); font-size: .88rem; margin: 14px 0 0; font-weight: 600; }

  /* ---------- buttons ---------- */
  .btn { border: none; background: var(--brand); color: var(--brand-ink); border-radius: 18px; padding: 15px 20px; font-weight: 800; font-size: 1.05rem; box-shadow: 0 4px 0 rgba(0,0,0,.18); transition: transform .08s ease, box-shadow .08s ease; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
  .btn.soft { background: var(--soft); color: var(--ink); box-shadow: 0 3px 0 rgba(106,75,240,.2); }
  .btn.warn { background: var(--bad); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn.mic { background: var(--sun); color: #2A1B00; width: 100%; padding: 17px; font-size: 1.1rem; }
  .btn.mic.rec { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 4px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(255,201,60,.7); } 50% { box-shadow: 0 4px 0 rgba(0,0,0,.18), 0 0 0 14px rgba(255,201,60,0); } }
  .iconbtn { width: 44px; height: 44px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
  .roundbtn { width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--sun); font-size: 22px; display: grid; place-items: center; padding: 0; position: absolute; top: 14px; right: 14px; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .mini { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--soft); font-size: 16px; display: grid; place-items: center; padding: 0; flex: none; }

  /* ---------- home ---------- */
  .band { background: var(--sun); color: var(--band-ink); padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 54px; border-radius: 0 0 36px 36px; position: relative; overflow: hidden; }
  .band::before, .band::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.28); }
  .band::before { width: 150px; height: 150px; right: -40px; top: -50px; }
  .band::after { width: 90px; height: 90px; left: -30px; bottom: -34px; }
  .band > * { position: relative; z-index: 1; }
  .toprow { display: flex; align-items: center; gap: 10px; }
  .brand { flex: 1; line-height: 1; }
  .brand .a { font-family: var(--f-head); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.01em; }
  .brand .b { font-family: var(--f-head); font-weight: 700; font-size: 1.05rem; color: #7A3FE0; }
  .streak { background: #fff; border-radius: 999px; padding: 7px 12px; font-weight: 800; font-size: .92rem; white-space: nowrap; color: #2B2A4C; }
  .bubble { margin-top: 12px; background: #fff; color: #2B2A4C; border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .bubble .ar { font-size: 1.4rem; color: #6A4BF0; }
  .cont { display: flex; align-items: center; justify-content: space-between; width: calc(100% - 32px); margin: -30px 16px 0; position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 14px 16px; text-align: left; box-shadow: 0 8px 0 -2px var(--line); }
  .cont .k { color: var(--brand); font-weight: 800; font-size: .85rem; }
  .cont .t { font-family: var(--f-head); font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
  .cont .m { color: var(--muted); font-size: .9rem; }
  .cont .go { width: 46px; height: 46px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; flex: none; }
  .cont.done { justify-content: center; font-weight: 800; }
  .potd { margin: 16px 16px 0; background: var(--soft); border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-align: left; width: calc(100% - 32px); border: none; }
  .potd .k { color: var(--brand); font-weight: 800; font-size: .82rem; }
  .potd .ar { font-size: 1.6rem; line-height: 1.5; }
  .potd .tx { flex: 1; min-width: 0; }
  .potd .b { color: var(--muted); font-size: .92rem; }
  .overall { margin: 18px 20px 4px; }
  .overall .row { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 6px; }
  .bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--lv, var(--brand)); border-radius: 6px; transition: width .3s ease; }
  .level { padding: 20px 16px 0; }
  .lh { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
  .lh h2 { margin: 0; font-size: 1.45rem; color: var(--lv); }
  .lh span { color: var(--muted); font-weight: 800; }
  .level > p { margin: 0 4px 10px; color: var(--muted); font-size: .92rem; }
  .tile { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 4px 0 var(--line); }
  .tile .ic { width: 50px; height: 50px; border-radius: 18px; background: var(--lv-soft); display: grid; place-items: center; font-size: 26px; flex: none; }
  .tile .tx { flex: 1; min-width: 0; }
  .tile .tt { font-weight: 800; }
  .tile .mm { color: var(--muted); font-size: .88rem; }
  .tile.locked { opacity: .55; }
  .tile.finished { border-color: var(--lv); }
  .stars { color: var(--gold); letter-spacing: 1px; font-size: 1.1rem; }
  .pill { background: var(--lv); color: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: .78rem; font-weight: 800; white-space: nowrap; }
  .pill.soft { background: var(--lv-soft); color: var(--ink); }
  .extras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 22px 16px 0; }
  .extra { border: none; border-radius: 22px; padding: 16px 12px; text-align: left; color: #2B2A4C; box-shadow: 0 5px 0 rgba(0,0,0,.14); }
  .extra.x1 { background: #FFB3A7; } .extra.x2 { background: #B9A8FF; }
  .extra .e { font-size: 1.8rem; } .extra .t { font-family: var(--f-head); font-weight: 800; font-size: 1.15rem; line-height: 1.15; margin-top: 4px; }
  .extra .m { font-size: .85rem; font-weight: 700; opacity: .85; }

  /* ---------- lesson ---------- */
  .lhead { display: flex; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 8px; }
  .lt .k { color: var(--lv); font-weight: 800; font-size: .85rem; }
  .lt .t { font-family: var(--f-head); font-weight: 700; font-size: 1.35rem; line-height: 1.1; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 16px 4px; }
  .step { border: none; background: var(--surface); border-radius: 14px; padding: 10px 4px; font-weight: 800; color: var(--muted); border-bottom: 4px solid var(--line); }
  .step.on { color: var(--ink); border-bottom-color: var(--lv); background: var(--lv-soft); }
  .body { padding: 10px 16px 24px; }
  .tip { background: var(--lv-soft); border-radius: 16px; padding: 10px 14px; margin: 0 0 12px; font-size: .92rem; }
  .count { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 800; color: var(--muted); }
  .count .bar { flex: 1; }
  .fcard { background: var(--surface); border: 2px solid var(--line); border-radius: 30px; min-height: 340px; padding: 70px 20px 26px; text-align: center; position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; box-shadow: 0 8px 0 var(--lv-soft); }
  .fcard .big { font-size: clamp(3rem, 16vw, 4.4rem); line-height: 1.5; color: var(--ink); }
  .fcard .big.l { font-size: clamp(2.1rem, 10vw, 2.9rem); }
  .fcard .big.m { font-size: clamp(1.5rem, 7.5vw, 2rem); }
  .tr { color: var(--brand); font-weight: 800; font-size: 1.3rem; }
  .en { color: var(--muted); font-size: 1.2rem; font-weight: 700; }
  .links { margin-top: 14px; font-size: .85rem; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .nudge { animation: nudge 1.3s ease-in-out .6s 2; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-16px) rotate(-1deg); } 75% { transform: translateX(16px) rotate(1deg); } }
  .hintline { text-align: center; color: var(--muted); font-size: .88rem; margin: 14px 0; }
  .navrow { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
  .notice { background: var(--coral-soft); border-radius: 16px; padding: 10px 14px; font-size: .9rem; margin-bottom: 12px; }
  .speaking .roundbtn, .speaking .mini { animation: pulse2 .9s ease-in-out infinite; }
  @keyframes pulse2 { 0%,100% { box-shadow: 0 0 0 0 rgba(120,100,240,.4); } 50% { box-shadow: 0 0 0 10px rgba(120,100,240,0); } }

  .qcard { background: var(--surface); border: 2px solid var(--line); border-radius: 28px; padding: 22px 18px; text-align: center; margin-bottom: 14px; min-height: 190px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 6px 0 var(--lv-soft); }
  .qcard .big { font-size: 3.2rem; line-height: 1.5; }
  .qcard .big.l { font-size: 2.2rem; } .qcard .big.m { font-size: 1.6rem; }
  .qlab { color: var(--muted); font-weight: 700; }
  .qen { font-family: var(--f-head); font-size: 1.7rem; font-weight: 700; line-height: 1.2; }
  .bigplay { width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--sun); font-size: 34px; display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: center; border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 15px 14px; font-weight: 700; font-size: 1.08rem; box-shadow: 0 4px 0 var(--line); }
  .opt .ar { font-size: 1.7rem; line-height: 1.5; }
  .opt:not(:disabled):hover { border-color: var(--brand); }
  .opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); }
  .opt:disabled { cursor: default; }
  .fb { margin: 14px 0 10px; padding: 12px 14px; border-radius: 16px; font-weight: 800; }
  .fb.good { background: var(--good-soft); color: var(--good); }
  .fb.bad { background: var(--bad-soft); color: var(--bad); }
  .fb small { display: block; font-weight: 700; color: var(--ink); margin-top: 2px; font-size: .95rem; }
  .results { text-align: center; padding-top: 10px; }
  .results .kaka { margin: 0 auto; }
  .results .score { font-family: var(--f-head); font-size: 4rem; font-weight: 800; line-height: 1; }
  .results .stars { font-size: 2.4rem; margin: 6px 0; display: block; }
  .results p { color: var(--muted); margin: 6px 0; }
  .results h2 { margin: 4px 0; font-size: 1.6rem; }
  .stack { display: grid; gap: 10px; margin-top: 14px; }
  .popin { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result { margin-top: 16px; border-top: 2px solid var(--line); padding-top: 12px; min-height: 3.4em; text-align: left; }
  .result .v { font-weight: 800; font-size: 1.1rem; }
  .result .v.good { color: var(--good); } .result .v.warn { color: var(--gold); } .result .v.bad { color: var(--bad); }
  .result .h { color: var(--muted); overflow-wrap: anywhere; }
  .result .h b { color: var(--ink); }

  /* ---------- phrases / words / me ---------- */
  .page { padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 24px; }
  .page h1 { font-size: 1.9rem; margin: 0 0 4px; line-height: 1.1; }
  .page .sub { color: var(--muted); margin: 0 0 12px; }
  .tabs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--soft); border-radius: 18px; padding: 5px; margin-bottom: 12px; }
  .tabs2 button { border: none; background: transparent; border-radius: 14px; padding: 10px 6px; font-weight: 800; color: var(--muted); }
  .tabs2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .search { width: 100%; padding: 13px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; margin-bottom: 8px; }
  .wgroup { margin-top: 18px; }
  .wgroup h3 { margin: 0 0 8px; font-size: 1.1rem; color: var(--brand); }
  .wrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px 14px; margin-bottom: 8px; }
  .wrow .ar { font-size: 1.5rem; min-width: 84px; line-height: 1.6; text-align: right; }
  .wrow .tx { flex: 1; min-width: 0; }
  .wrow .a { font-weight: 800; color: var(--brand); font-size: .95rem; }
  .wrow .b { color: var(--muted); font-size: .92rem; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .phr { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .phr .tx { flex: 1; min-width: 0; }
  .phr .ar { font-size: 1.45rem; line-height: 1.6; }
  .phr .a { font-weight: 800; color: var(--brand); font-size: .95rem; }
  .phr .b { color: var(--muted); font-size: .92rem; }
  .qa { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 4px 0 var(--line); }
  .qa .n { font-weight: 800; color: var(--muted); font-size: .8rem; }
  .qrow, .arow { display: flex; align-items: flex-start; gap: 10px; }
  .qrow .ar, .arow .ar { font-size: 1.4rem; line-height: 1.6; }
  .arow { margin-top: 10px; padding: 10px; background: var(--good-soft); border-radius: 16px; }
  .qa .a { font-weight: 800; color: var(--brand); font-size: .92rem; }
  .qa .b { color: var(--muted); font-size: .92rem; }
  .arow .a { color: var(--good); }
  .reveal { margin-top: 10px; width: 100%; border: 2px dashed var(--brand); background: transparent; color: var(--brand); border-radius: 16px; padding: 10px; font-weight: 800; }
  .card2 { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 14px 16px; margin-bottom: 14px; }
  .card2 h2 { font-size: 1.15rem; margin: 0 0 8px; }
  .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 2px solid var(--line); }
  .row2:first-of-type { border-top: none; }
  .row2 small { display: block; color: var(--muted); font-weight: 600; }
  .sw { width: 54px; height: 32px; border-radius: 16px; border: none; background: var(--line); position: relative; flex: none; padding: 0; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .sw[aria-checked="true"] { background: var(--mint); }
  .sw[aria-checked="true"]::after { transform: translateX(22px); }
  .links2 a { display: block; padding: 8px 0; border-top: 2px solid var(--line); text-decoration: none; font-weight: 800; }
  .links2 a small { display: block; color: var(--muted); font-weight: 600; }
  .prof { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .prof .n { font-family: var(--f-head); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
  .prof .m { color: var(--muted); }

/* ---------- mic matching ---------- */
function normS(s) {
  return s.normalize("NFC")
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[\u064B-\u065F\u0670\u0640\u200c\u200d]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
    .replace(/[\s؟?!.,،:;"'«»…\-]/g, "").toLowerCase();
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function similarity(heard, item) {
  const targets = [item[0]].concat(item[3] ? item[3].split(" ") : []);
  const a = normS(heard);
  return Math.max(...targets.map(t => { const b = normS(t); const len = Math.max(a.length, b.length); return len ? 1 - lev(a, b) / len : 0; }));
}

function bindSwipe(el, onLeft, onRight, onTap) {

/* ---------- practice ---------- */
function buildQuiz() {
  const items = LESSONS[S.li].items, vc = hasVoice();
  const others = LESSONS.flatMap((x, i) => i === S.li ? [] : x.items);
  const distract = (correct, key) => {
    const pool = shuffle(items.filter(x => x !== correct)).concat(shuffle(others.slice()));
    const seen = new Set([correct[key]]), out = [];
    for (const x of pool) { if (!seen.has(x[key])) { seen.add(x[key]); out.push(x); } if (out.length === 3) break; }
    return out;
  };
  const chosen = shuffle(items.slice()).slice(0, Math.min(items.length >= 24 ? 12 : 10, items.length));
  const types = vc ? ["listen", "see", "pick"] : ["see", "pick"];
  const qs = chosen.map((it, k) => {
    const type = types[k % types.length], key = type === "pick" ? 0 : 2;
    const opts = shuffle([it].concat(distract(it, key)));
    return { type, item: it, opts, answer: opts.indexOf(it) };
  });
  return { qs, i: 0, correct: 0, answered: null, done: false };
}
function quizHTML() {
  const Q = S.quiz;
  if (Q.done) return resultsHTML();
  const q = Q.qs[Q.i], it = q.item, ans = Q.answered !== null, n = Q.qs.length;
  let prompt;
  if (q.type === "listen") prompt = `<button class="bigplay" data-action="qplay" aria-label="Play audio">🔊</button><div class="qlab">What does this mean?</div>`;
  else if (q.type === "see") prompt = `<div class="ar big ${scriptSize(it[0])}" lang="ar">${esc(it[0])}</div>${ans && U().settings.translit ? `<div class="tr">${esc(it[1])}</div>` : ""}<div class="qlab">What does this mean?</div>`;
  else prompt = `<div class="qlab">Which one means</div><div class="qen">${esc(it[2])}</div>`;
  const opts = q.opts.map((o, k) => {
    const cls = ans ? (k === q.answer ? "right" : k === Q.answered ? "wrong" : "") : "";
    const label = q.type === "pick" ? `<span class="ar" lang="ar">${esc(o[0])}</span>` : esc(o[2]);
    return `<button class="opt ${cls}" data-action="answer" data-k="${k}" ${ans ? "disabled" : ""}>${label}</button>`;
  }).join("");
  const ok = ans && Q.answered === q.answer;
  const fb = ans ? `<div class="fb ${ok ? "good" : "bad"}">${ok ? "Correct! 🎉" : "Not quite."}<small><span class="ar" lang="ar">${esc(it[0])}</span> · ${esc(it[1])} · ${esc(it[2])}</small></div>
    <button class="btn" style="width:100%" data-action="qnext">${Q.i === n - 1 ? "See results" : "Continue"}</button>` : "";
  return `<div class="body">
    <div class="count"><span>${Q.i + 1} / ${n}</span><div class="bar"><i style="width:${(Q.i + (ans ? 1 : 0)) / n * 100}%"></i></div></div>
    <div class="qcard">${prompt}</div><div class="opts">${opts}</div>${fb}</div>`;
}
function answer(k) {
  const Q = S.quiz; if (Q.answered !== null) return;
  const q = Q.qs[Q.i]; Q.answered = k; if (k === q.answer) Q.correct++;
  render(false); speak(q.item[0]);
}
function qnext() {
  const Q = S.quiz; Q.answered = null; Q.i++;
  if (Q.i >= Q.qs.length) { Q.done = true; finishQuiz(); }
  render(true);
}
function finishQuiz() {
  const Q = S.quiz, p = curProg(); Q.pct = Math.round(Q.correct / Q.qs.length * 100);
  Q.pass = Q.pct >= 70; Q.stars = Q.pct >= 90 ? 3 : Q.pct >= 80 ? 2 : Q.pass ? 1 : 0;
  Q.msg = Q.pass ? pick(WIN) : pick(TRY);
  p.best = Math.max(p.best, Q.pct);
  if (Q.pass) { p.done = true; p.learned = true; p.stars = Math.max(p.stars, Q.stars); }
  touchStreak(); saveDB();
}
function resultsHTML() {
  const Q = S.quiz, hasNext = S.li < LESSONS.length - 1;
  return `<div class="body results">
    ${kaka(96, true)}
    <div class="score popin">${Q.pct}%</div>
    <span class="stars popin">${"★".repeat(Q.stars)}${"☆".repeat(3 - Q.stars)}</span>
    <h2>${esc(Q.msg)}</h2>
    <p>${Q.correct} of ${Q.qs.length} correct. ${Q.pass ? (hasNext ? "The next lesson is unlocked." : "You finished the whole course!") : "You need 70% to pass. Review the cards and try again."}</p>
    <div class="stack">
      ${Q.pass && hasNext ? `<button class="btn" data-action="nextLesson">Next lesson</button>` : ""}
      ${Q.pass ? `<button class="btn soft" data-action="step" data-step="speak">Practice speaking</button>` : `<button class="btn" data-action="retry">Try again</button><button class="btn soft" data-action="step" data-step="learn">Review cards</button>`}
      <button class="btn ghost" data-action="back">Back to lessons</button>
    </div></div>`;
}

/* ---------- speak ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
const newSpeak = () => ({ items: shuffle(LESSONS[S.li].items.slice()).slice(0, 10), i: 0, ok: 0, res: null, msg: null, counted: false });
function speakHTML() {
  const sp = S.sp, n = sp.items.length;
  if (sp.i >= n) {
    const p = curProg(); p.spoke = Math.max(p.spoke, sp.ok); saveDB();
    return `<div class="body results">${kaka(96, true)}<div class="score popin">${sp.ok}/${n}</div><h2>Said clearly!</h2><p>Practice makes it smoother. Come back any time.</p>
      <div class="stack"><button class="btn" data-action="back">Back to lessons</button><button class="btn soft" data-action="step" data-step="speak">Go again</button></div></div>`;
  }
  const it = sp.items[sp.i], r = sp.res;
  const res = r ? `<div class="v ${r.cls}">${esc(r.label)}</div><div class="h">I heard: <b>${esc(r.heard || "(nothing)")}</b></div>` : (sp.msg ? `<div class="v bad">${esc(sp.msg.t)}</div><div class="h">${esc(sp.msg.d || "")}</div>` : "");
  return `<div class="body">
    <div class="count"><span>${sp.i + 1} / ${n}</span><div class="bar"><i style="width:${sp.i / n * 100}%"></i></div></div>
    <div class="fcard" style="cursor:default;min-height:270px">
      <button class="roundbtn" data-action="splay" aria-label="Play pronunciation">🔊</button>
      <div class="ar big ${scriptSize(it[0])}" lang="ar">${esc(it[0])}</div>
      <div class="tr">${esc(it[1])}</div><div class="en">${esc(it[2])}</div>
      <div class="links">${onlineLinks(it[0])}</div>
    </div>
    <button class="btn mic ${S.listening ? "rec" : ""}" style="margin-top:14px" data-action="mic">${S.listening ? "⏹ Listening… tap to stop" : "🎤 Say it"}</button>
    <div class="result" aria-live="polite">${res}</div>
    <div class="navrow" style="margin-top:12px"><button class="btn ghost" data-action="spnext">Skip</button><button class="btn" data-action="spnext">Next</button></div>
  </div>`;
}
function listen() {
  if (!SR) { S.sp.res = null; S.sp.msg = { t: "Speaking practice isn't supported here", d: "Try Chrome, Edge or Safari. Firefox has no speech recognition." }; render(false); return; }
  if (S.listening && recog) { recog.stop(); return; }
  stopAudio();
  const it = S.sp.items[S.sp.i];
  recog = new SR(); recog.lang = SPEECH; recog.interimResults = false; recog.maxAlternatives = 3;
  recog.onstart = () => { S.listening = true; render(false); };
  recog.onend = () => { S.listening = false; render(false); };
  recog.onerror = e => {
    if (e.error === "aborted") return;
    const m = { "not-allowed": ["Mic access is blocked", "Allow the microphone for this site in your browser settings."],
      "service-not-allowed": ["Mic access is blocked", "Allow the microphone for this site in your browser settings."],
      "no-speech": ["Didn't catch anything", "Tap the mic and try again a little louder."],
      "language-not-supported": ["Arabic isn't supported by this browser's recognizer", "Try Chrome on desktop or Android."] }[e.error];
    S.sp.res = null; S.sp.msg = m ? { t: m[0], d: m[1] } : { t: "Couldn't listen (" + e.error + ")", d: "Check your connection and try again." };
  };
  recog.onresult = e => {
    const alts = Array.from(e.results[0]).map(a => a.transcript);
    let best = -1, heard = alts[0] || "";
    alts.forEach(t => { const s = similarity(t, it); if (s > best) { best = s; heard = t; } });
    const cls = best >= 0.85 ? "good" : best >= 0.6 ? "warn" : "bad";
    const label = (best >= 0.85 ? "Nailed it" : best >= 0.6 ? "Close" : "Try again") + " · " + Math.round(best * 100) + "%";
    if (best >= 0.7 && !S.sp.counted) { S.sp.ok++; S.sp.counted = true; }
    S.sp.res = { cls, label, heard }; S.sp.msg = null;
  };
  try { recog.start(); } catch (err) {}
}
function spMove() {
  if (recog && S.listening) { try { recog.abort(); } catch (er) {} S.listening = false; }
  S.sp.i++; S.sp.res = null; S.sp.msg = null; S.sp.counted = false; render(true);
}

/* ---------- phrases tab ---------- */
function funListHTML() {
  const q = S.pq.trim(), ql = q.toLowerCase(); let out = "", total = 0;
  PHRASES.forEach(c => {
    const rows = c.items.map((it, ii) => [it, ii]).filter(([it]) => !q || it[2].toLowerCase().includes(ql) || it[1].toLowerCase().includes(ql) || it[0].includes(q));
    if (!rows.length) return; total += rows.length;
    const ci = PHRASES.indexOf(c);
    out += `<div class="wgroup"><h3>${c.icon} ${esc(c.cat)}</h3>${rows.map(([it, ii]) =>
      `<button class="phr" data-action="phplay" data-ci="${ci}" data-ii="${ii}"><span class="tx"><div class="ar" lang="ar">${esc(it[0])}</div><div class="a">${esc(it[1])}</div><div class="b">${esc(it[2])}</div></span><span class="mini" aria-hidden="true">🔊</span></button>`).join("")}</div>`;
  });
  return total ? out : `<div class="empty">No matches. Try an English word.</div>`;
}
function qaListHTML() {
  const q = S.pq.trim(), ql = q.toLowerCase(); let out = "", total = 0, n = 0;
  QA_THEMES.forEach((th, ti) => {
    let rows = "";
    th.items.forEach((it, ii) => {
      n++;
      if (q && !(it[2] + " " + it[5] + " " + it[1] + " " + it[4]).toLowerCase().includes(ql) && !(it[0] + it[3]).includes(q)) return;
      total++;
      const open = !!S.qaOpen[ti + "-" + ii];
      rows += `<div class="qa"><div class="n">Question ${n}</div>
        <div class="qrow"><button class="mini" data-action="qaplay" data-ti="${ti}" data-ii="${ii}" data-part="q" aria-label="Play question">🔊</button><div><div class="ar" lang="ar">${esc(it[0])}</div><div class="a">${esc(it[1])}</div><div class="b">${esc(it[2])}</div></div></div>
        ${open ? `<div class="arow"><button class="mini" data-action="qaplay" data-ti="${ti}" data-ii="${ii}" data-part="a" aria-label="Play answer">🔊</button><div><div class="ar" lang="ar">${esc(it[3])}</div><div class="a">${esc(it[4])}</div><div class="b">${esc(it[5])}</div></div></div>`
               : `<button class="reveal" data-action="qatoggle" data-ti="${ti}" data-ii="${ii}">Show sample answer</button>`}</div>`;
    });
    if (rows) out += `<div class="wgroup"><h3>${th.icon} ${esc(th.name)}</h3>${rows}</div>`;
  });
  return total ? out : `<div class="empty">No matches. Try an English word.</div>`;
}
function phrasesHTML() {
  const fun = S.sub === "fun", total = PHRASES.reduce((a, c) => a + c.items.length, 0);
  return `<div class="page"><h1>${fun ? "Fun & useful phrases" : "100 everyday Q&amp;A"}</h1>
    <p class="sub">${fun ? "Say these out loud. Tap any phrase to hear it." : "Questions use the masculine “you”. Tap “Show sample answer” after you try."}</p>
    <div class="tabs2"><button data-action="sub" data-sub="fun" aria-pressed="${fun}">Phrases (${total})</button><button data-action="sub" data-sub="qa" aria-pressed="${!fun}">Q&amp;A (100)</button></div>
    <input id="pq" class="search" type="search" placeholder="Search in English or Arabic" value="${esc(S.pq)}" aria-label="Search">
    <div id="plist">${fun ? funListHTML() : qaListHTML()}</div></div>`;
}

/* ---------- words tab ---------- */
function wordsListHTML() {
  const q = S.q.trim(), ql = q.toLowerCase(); let out = "", total = 0;
  LESSONS.forEach((les, li) => {
    const rows = les.items.map((it, ii) => [it, ii]).filter(([it]) => !q || it[2].toLowerCase().includes(ql) || it[1].toLowerCase().includes(ql) || it[0].includes(q));
    if (!rows.length) return; total += rows.length;
    out += `<div class="wgroup"><h3>${les.icon} ${li + 1}. ${esc(les.title)}</h3>${rows.map(([it, ii]) =>
      `<button class="wrow" data-action="wplay" data-li="${li}" data-ii="${ii}"><span class="ar" lang="ar">${esc(it[0])}</span><span class="tx"><div class="a">${esc(it[1])}</div><div class="b">${esc(it[2])}</div></span><span aria-hidden="true">🔊</span></button>`).join("")}</div>`;
  });
  return total ? out : `<div class="empty">No matches. Try an English word.</div>`;
}
function wordsHTML() {
  const total = LESSONS.reduce((a, x) => a + x.items.length, 0);
  return `<div class="page"><h1>All words</h1><p class="sub">${total} words and phrases from the lessons.</p>
    <input id="wq" class="search" type="search" placeholder="Search in English or Arabic" value="${esc(S.q)}" aria-label="Search words">
    <div id="wlist">${wordsListHTML()}</div></div>`;
}

/* ---------- me ---------- */
function sw(key, title, sub) {
  return `<div class="row2"><div>${title}<small>${sub}</small></div><button class="sw" role="switch" aria-checked="${U().settings[key]}" aria-label="${title}" data-action="toggle" data-key="${key}"></button></div>`;
}
function meHTML() {
  const u = U(), done = LESSONS.filter((_, i) => prog(i).done).length, v = voice();
  return `<div class="page"><h1>Me</h1>
    <div class="prof">${kaka(64, false)}<div><div class="n">${esc(u.name)}</div><div class="m">${done}/15 lessons · 🔥 ${u.streak.count} day streak</div></div></div>
    <div class="card2"><h2>Settings</h2>
      ${sw("translit", "Show transliteration", "Latin spelling under the Arabic")}
      ${sw("auto", "Auto-play audio", "Hear each card as you swipe")}
      ${sw("slow", "Slow speech", "Slower pronunciation for beginners")}
      ${sw("unlockAll", "Unlock all lessons", "Skip the lesson order")}
    </div>
    <div class="card2"><h2>Arabic voice on this device</h2><div class="row2"><div>${v ? esc(v.name) : "Not found"}<small>${v ? "Audio is ready." : "Use “Hear online” links, or install an Arabic voice in your device's speech settings."}</small></div></div></div>
    <div class="card2"><h2>Learners</h2>
      <button class="btn ghost" style="width:100%;margin-bottom:10px" data-action="switchUser">Switch or add learner</button>
      <button class="btn ${S.resetArmed ? "warn" : "ghost"}" style="width:100%" data-action="reset">${S.resetArmed ? "Tap again to erase " + esc(u.name) + "'s progress" : "Reset my progress"}</button>
      ${S.volatile ? `<p class="fine">Your browser blocked saving. Progress will be lost when you close this page.</p>` : ""}
    </div>
    <div class="card2 links2"><h2>Free resources</h2>
      <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba<small>Free example sentences with translations</small></a>
      <a href="https://en.wiktionary.org" target="_blank" rel="noopener">Wiktionary<small>Free dictionary with pronunciation and grammar</small></a>
      <a href="https://forvo.com" target="_blank" rel="noopener">Forvo<small>Native speakers saying words</small></a>
      <a href="https://commonvoice.mozilla.org" target="_blank" rel="noopener">Mozilla Common Voice<small>Open voice recordings</small></a>
    </div>
    <p class="fine">Arabic here is Modern Standard Arabic, with a few everyday spoken phrases. Real speech varies by country. Have a native speaker check anything you plan to rely on.</p>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-action]"); if (!a) return;
  const d = a.dataset;
  switch (d.action) {
    case "pickUser": db.lastUser = d.key; S.user = d.key; S.tab = "learn"; S.view = "home"; saveDB(); touchStreak(); render(true); break;
    case "tab": S.tab = d.tab; S.resetArmed = false; render(true); break;
    case "goPhrases": S.tab = "phrases"; S.sub = d.sub; S.pq = ""; render(true); break;
    case "sub": S.sub = d.sub; S.pq = ""; render(false); break;
    case "open": {
      const i = +d.li;
      if (!unlocked(i)) { toast("Finish lesson " + i + " first, or unlock all in Me."); break; }
      startLesson(i, d.resume === "1"); break;
    }
    case "back": back(); break;
    case "step": setStep(d.step); break;
    case "play": playCurrent(); break;
    case "next": goCard(1); break;
    case "prev": goCard(-1); break;
    case "toPractice": setStep("practice"); break;
    case "qplay": speak(S.quiz.qs[S.quiz.i].item[0]) || noVoice(); break;
    case "answer": answer(+d.k); break;
    case "qnext": qnext(); break;
    case "retry": S.quiz = buildQuiz(); render(true); break;
    case "nextLesson": startLesson(S.li + 1, false); break;
    case "splay": speak(S.sp.items[S.sp.i][0]) || noVoice(); break;
    case "mic": listen(); break;
    case "spnext": spMove(); break;
    case "wplay": speak(LESSONS[+d.li].items[+d.ii][0]) || noVoice(); break;
    case "phplay": speak(PHRASES[+d.ci].items[+d.ii][0]) || noVoice(); break;
    case "potd": { const f = PHRASES.flatMap(c => c.items); speak(f[dayNum() % f.length][0]) || noVoice(); break; }
    case "qaplay": { const it = QA_THEMES[+d.ti].items[+d.ii]; speak(d.part === "q" ? it[0] : it[3]) || noVoice(); break; }
    case "qatoggle": S.qaOpen[d.ti + "-" + d.ii] = true; $("#plist").innerHTML = qaListHTML(); break;
    case "toggle": U().settings[d.key] = !U().settings[d.key]; saveDB(); render(false); break;
    case "switchUser": stopAudio(); S.user = null; render(true); break;
    case "reset":
      if (!S.resetArmed) { S.resetArmed = true; render(false); setTimeout(() => { if (S.resetArmed) { S.resetArmed = false; if (S.user && S.view === "home" && S.tab === "me") render(false); } }, 4000); }
      else { U().progress = {}; U().resume = null; U().hints.swipe = false; S.resetArmed = false; saveDB(); toast("Progress reset"); render(true); }
      break;
  }
});
document.addEventListener("submit", e => { if (e.target.id === "nameForm") { e.preventDefault(); login($("#nameIn").value); } });
document.addEventListener("input", e => {
  if (e.target.id === "wq") { S.q = e.target.value; $("#wlist").innerHTML = wordsListHTML(); }
  if (e.target.id === "pq") { S.pq = e.target.value; $("#plist").innerHTML = S.sub === "fun" ? funListHTML() : qaListHTML(); }
});

/* ---------- init ---------- */
loadDB();
if (synthOK) { loadVoices(); speechSynthesis.addEventListener("voiceschanged", () => { loadVoices(); if (S.user && S.tab === "me" && S.view === "home") render(false); }); }
if (db.lastUser && db.users[db.lastUser]) { S.user = db.lastUser; touchStreak(); }
render(true);

})();
</script>
</body>
